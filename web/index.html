<!DOCTYPE html>
<html>
<head>
  <!-- 
    If you serve your app from a subdirectory, set the base href accordingly.
    Otherwise, leave it as is (Flutter replaces $FLUTTER_BASE_HREF).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="myapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>myapp</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 
    Flutter loads fonts automatically from your pubspec.yaml (assets/fonts/).
    No need to link them here unless you want additional external fonts.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
